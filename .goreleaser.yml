# GoReleaser v2 configuration for Codvian Router.
#
# Produces static, cross-compiled release binaries for every supported
# platform (linux/darwin/windows, amd64/arm64) plus archives, a
# checksums file, a per-archive SBOM, and Sigstore cosign keyless
# signatures — published as an ordinary GitHub release by
# .github/workflows/release.yml, which runs only on a `v*.*.*` tag.
# No tag or release is created by this file; the first release is a
# maintainer decision (see docs/RELEASE-SIGNING.md).
#
# The same release also publishes a signed multi-arch Docker image
# (linux/amd64 + linux/arm64) to ghcr.io/raunakiitp/codvian-router
# (`dockers_v2`, built from Dockerfile.release out of the pre-built
# binaries — the image carries the exact binary that ships in the
# archives) and signs it with the same cosign keyless identity as the
# blobs (`docker_signs`). Users verify the image with
# scripts/verify-image.sh BEFORE `docker run`.
#
# Signing: the checksum file AND each SBOM are signed with cosign
# keyless (Sigstore bundle `<artifact>.sigstore.json`, identity pinned
# to the release workflow + tag ref). Signing only the checksum file
# would leave the SBOMs unauthenticated, so they get their own
# signatures. Users verify with scripts/verify-release.sh before
# installing anything.
#
# SBOM: one SPDX-JSON SBOM per archive, generated by syft (installed by
# the release workflow). The dependency-free local generator
# (cmd/release-sbom, CycloneDX) is the fallback when syft is absent.
#
# Run locally (requires a git tag, e.g. v0.1.0):
#   goreleaser release --clean          # real release (publishes)
#   goreleaser release --snapshot --clean   # local build only, no publish
# A snapshot build produces UNSIGNED artifacts (no OIDC identity
# exists outside CI) — never distribute snapshot output as a release.
# The npm wrapper (bin/codvian-router.js) and scripts/install.sh download
# the archives produced here, so their naming must stay in sync:
#   codvian-router_<version>_<os>_<arch>.tar.gz  (.zip on Windows)

version: 2

project_name: codvian-router

before:
  hooks:
    - go mod download

builds:
  - id: codvian-router
    main: ./cmd/codvian-router
    binary: codvian-router
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX-JSON SBOM per archive (<archive>.sbom.json), generated by
# syft. The release workflow installs syft before running GoReleaser;
# without it this step fails rather than silently skipping the SBOM.
sboms:
  - artifacts: archive

# Sigstore cosign, keyless (GitHub Actions OIDC identity). No long-term
# signing key exists anywhere: the certificate is minted per release by
# Sigstore, bound to the release workflow + tag ref, and logged in the
# public Rekor transparency log. This is the documented GoReleaser
# keyless pattern (sign-blob --bundle); see docs/RELEASE-SIGNING.md
# for the choice (cosign keyless over minisign) and the exact verify
# commands. `artifacts: checksum` signs checksums.txt (which covers
# every archive); the second entry signs each SBOM directly, because a
# checksums signature alone does not authenticate the SBOM files.
signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
  - id: sbom
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: sbom

# Docker image (GoReleaser dockers_v2, since v2.12 — the current
# recommended way; the old `dockers` + `docker_manifests` pair is
# deprecated and will be removed in GoReleaser v3). One multi-arch
# manifest (linux/amd64 + linux/arm64) per tag, pushed to GHCR.
#
# The image is built from Dockerfile.release, NOT from Dockerfile:
# dockers_v2 hands the Dockerfile a temporary context that contains
# only the pre-built binaries (no source files), so Dockerfile's
# multi-stage `go build` cannot work there. Dockerfile.release copies
# the GoReleaser-built binary for $TARGETPLATFORM — the image therefore
# carries the exact binary that ships in the release archives — and
# builds only the tiny healthcheck helper itself (its source is inline
# in that file, kept in sync with Dockerfile).
#
# Tags: the release tag (e.g. v0.1.0) AND latest. `latest` moves on
# every release, so pin a version tag (or better, the digest) in
# production; verify either way with scripts/verify-image.sh first.
#
# SBOM: GoReleaser attaches an SBOM to the image by default (sbom is
# true unless set otherwise) using syft + cosign; the workflow
# installs both tools before running GoReleaser.
#
# dockers_v2 is still marked provisional/alpha by GoReleaser (it will
# become `dockers` in v3). If it breaks in a future GoReleaser release,
# the fallback is the deprecated `dockers` + `docker_manifests` pair
# with the same Dockerfile.release; the workflow's verify job fails
# the release loudly if the image does not publish.
dockers_v2:
  - images:
      - ghcr.io/raunakiitp/codvian-router
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    ids:
      - codvian-router
    annotations:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
      "org.opencontainers.image.title": "Codvian Router"

# Sign the published Docker image with the SAME cosign keyless identity
# as the release blobs. No --key flag: cosign uses the ambient GitHub
# OIDC token (the workflow grants id-token: write), so the certificate
# is bound to the release workflow + tag ref, exactly like the
# checksums.txt / SBOM signatures — one identity for the whole
# release, whether the user installs the binary or pulls the image.
# `artifacts: all` covers the multi-arch manifest (what users pull by
# tag) and the per-platform images; `${artifact}@${digest}` pins each
# signature to the exact digest, so a tampered image pushed under the
# same tag does not verify. `output: true` keeps cosign's output in
# the CI log (GoReleaser otherwise discards it). No `artifacts` filter:
# the default already means "images built by dockers_v2", and
# GoReleaser plans to deprecate that filter for docker_signs.
docker_signs:
  - id: docker-image
    cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

# Linux system packages (deb/rpm) via nfpm — GAP-TRACK PKG-5.
# Built from the same `codvian-router` build as the archives, so the
# packaged binary is identical to the tarball binary. Installs to
# /usr/bin/codvian-router (`codvian-router version` prints the
# version). nfpm is bundled inside GoReleaser — no separate install
# is needed; the release workflow needs no change. The maintainer has
# no public contact email, so it is the bare project name; fill in a
# real `Name <email>` before the first packaged release if one exists.
nfpms:
  - id: codvian-router
    package_name: codvian-router
    vendor: Codvian
    homepage: https://github.com/raunakiitp/CodvianRouter
    maintainer: Codvian
    description: Local-first, self-hosted LLM API router — one key, one base URL, automatic failover across any provider.
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: ./README.md
        dst: /usr/share/doc/codvian-router/README.md

# Homebrew formula — GAP-TRACK PKG-5. `directory` writes the formula
# into dist/ instead of pushing it: no Homebrew tap repository exists
# yet, and pushing to a nonexistent tap would fail the whole release.
# Once a tap repo exists (e.g. raunakiitp/homebrew-codvian-router)
# plus a HOMEBREW_TAP_GITHUB_TOKEN secret in the release workflow,
# replace `directory` with a `repository` block (owner/name/branch/
# token) and the formula will be published on every release.
brews:
  - name: codvian-router
    directory: dist/brew
    homepage: https://github.com/raunakiitp/CodvianRouter
    description: Local-first, self-hosted LLM API router — one key, one base URL, automatic failover across any provider.
    license: MIT
