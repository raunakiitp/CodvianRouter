# Codvian Router — local Docker Compose setup.
#
#   docker compose up -d --build
#
# First run (creates config + first gateway key; the key is printed ONCE):
#   docker compose run --rm codvian-router init
# Then start serving and check health:
#   docker compose up -d
#   curl http://127.0.0.1:20128/healthz
#
# NETWORKING — how the port mapping works:
# the router binds 127.0.0.1 by default, which Docker's published-port
# forwarding cannot reach (it delivers traffic to the container's eth0
# address). So this file runs serve with `--listen 0.0.0.0:20128` — the
# binary's explicit opt-in for a non-loopback bind (see cmd/codvian-router:
# only 127.0.0.1, ::1 and 0.0.0.0 are accepted, 0.0.0.0 prints a warning,
# and gateway-key auth stays ON). With that, the `ports:` mapping below
# works and the router is reachable on the host's 127.0.0.1:20128.
# Alternative if you would rather keep the loopback-only bind: delete
# `command:` and `ports:` and use `network_mode: host` instead, which
# shares the host's loopback. Do not weaken the bind any other way.
# (The healthcheck runs inside the container against 127.0.0.1 and is
# unaffected by either choice.)

services:
  codvian-router:
    build: .
    image: codvian-router:local
    container_name: codvian-router
    command: ["serve", "--listen", "0.0.0.0:20128"]
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      # Ledger + vault master secret. Losing this loses the vault and history.
      - codvian-router-data:/home/nonroot/.local/share/codvian-router
      # Config file (providers, gateway keys, listen address).
      - codvian-router-config:/home/nonroot/.config/codvian-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/codvian-router-healthcheck"]
      interval: 30s
      timeout: 3s
      start-period: 10s
      retries: 3

volumes:
  codvian-router-data:
  codvian-router-config:
