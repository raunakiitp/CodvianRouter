name: supply-chain
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  sbom-and-vuln:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.4"
      - name: Generate + validate SBOM
        run: |
          python3 scripts/sbom.py --out /tmp/sbom.json
          python3 scripts/sbom.py --self-check
          echo "SBOM components: $(python3 -c 'import json;print(len(json.load(open("/tmp/sbom.json"))["components"]))')"
      - name: govulncheck (G-06 dependency scan)
        # AUD-TEST-003: this step used to run `govulncheck ... || true`,
        # which meant a report full of reachable vulnerabilities still
        # exited 0 and the gate could NEVER fail. The pin is deliberate
        # too: `@latest` made the scanned toolchain drift under the scan.
        #
        # Policy, unchanged in spirit: the scan must actually run and its
        # output must be in the log. Only a clean exit 0 (no findings)
        # passes. Reachable findings fail the job (govulncheck exits 3).
        # A tool or vulnerability-DB failure also fails the job, with a
        # distinct message, because "the scanner could not run" must never
        # be reported as "no vulnerabilities" - the previous wording
        # explicitly refused that reading, and this keeps that promise
        # while removing the swallow.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          set +e
          govulncheck -format text ./... > /tmp/govulncheck.txt 2>&1
          rc=$?
          set -e
          echo "=== govulncheck output (exit $rc) ==="
          cat /tmp/govulncheck.txt
          case "$rc" in
            0)
              echo "PASS: govulncheck found no known vulnerabilities"
              ;;
            3)
              echo "FAIL: govulncheck reported reachable vulnerabilities (see the output above)"
              exit 1
              ;;
            *)
              echo "FAIL: govulncheck could not complete (exit $rc - tool install, network or vulnerability-DB failure); refusing to report this as a clean scan"
              exit 1
              ;;
          esac
